<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery | Haven Floral Rentals</title>

    <!-- Shared website styles -->
    <link rel="stylesheet" href="style.css">

    <!-- Gallery-specific styles -->
    <link rel="stylesheet" href="gallery.css">
</head>

<body>

    <!-- =========================
         NAVIGATION
         ========================= -->

    <header>

        <div class="logo">
            <img src="images/logo.png" alt="Haven Floral Rentals">
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="gallery.html" class="active">Gallery</a>
            <a href="event.html">Event</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>


    <!-- =========================
         GALLERY
         ========================= -->

    <main class="gallery-page">

        <!-- PAGE HEADING -->

        <section class="gallery-heading">

            <p class="gallery-label">
                OUR WORK
            </p>

            <h1>Gallery</h1>

            <p class="gallery-description">
                Explore a selection of floral arch designs
                from past events.
            </p>

        </section>


        <!-- =========================
             PHOTO GRID
             ========================= -->

        <section class="gallery-grid">


            <div class="gallery-item">
                <img
                    src="images/gallery/gallery1.PNG"
                    alt="Pink and white floral arch with draping and lights"
                >
            </div>


            <div class="gallery-item">
                <img
                    src="images/gallery/gallery2.PNG"
                    alt="Wedding floral arch with burgundy draping"
                >
            </div>


            <div class="gallery-item">
                <img
                    src="images/gallery/gallery3.PNG"
                    alt="Burgundy floral arch with hanging lights"
                >
            </div>


            <div class="gallery-item">
                <img
                    src="images/gallery/gallery4.PNG"
                    alt="Pink and white floral arch arrangement"
                >
            </div>


            <div class="gallery-item">
                <img
                    src="images/gallery/gallery5.PNG"
                    alt="Blue and white floral arch at an outdoor ceremony"
                >
            </div>


            <div class="gallery-item">
                <img
                    src="images/gallery/gallery6.PNG"
                    alt="Blue and white floral arch with draping"
                >
            </div>


        </section>

    </main>

</body>

</html>
