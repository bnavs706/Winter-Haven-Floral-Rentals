<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Review Your Design | Haven Floral Rentals</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="review.css">
</head>

<body>

    <header>

        <div class="logo">
            <img src="images/logo.png" alt="Haven Floral Rentals">
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="gallery.html">Gallery</a>
            <a href="event.html" class="active">Event</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>


    <main class="review-page">

        <section class="review-heading">

            <p>YOUR EVENT</p>

            <h1>Review Your Design</h1>

            <p>
                Make sure everything looks right before continuing.
            </p>

        </section>


        <section class="review-card">

            <h2>Your Selections</h2>


            <div class="review-item">

                <span class="review-label">
                    Event Date
                </span>

                <span id="review-date">
                    No date selected
                </span>

            </div>


            <div class="review-item">

                <span class="review-label">
                    Floral Design
                </span>

                <span id="review-floral">
                    Golden Garden
                </span>

            </div>


            <div class="review-item">

                <span class="review-label">
                    Draping
                </span>

                <span id="review-draping">
                    None
                </span>

            </div>


            <div class="review-item">

                <span class="review-label">
                    Lighting
                </span>

                <span id="review-lighting">
                    None
                </span>

            </div>


            <div class="review-actions">

                <a
                    href="arch.html"
                    class="button secondary-button"
                >
                    Edit Design
                </a>

                <button
                    type="button"
                    class="button primary-button"
                    id="confirm-design"
                >
                    Confirm Design
                </button>

            </div>

        </section>

    </main>


    <script src="review.js"></script>

</body>

</html>
