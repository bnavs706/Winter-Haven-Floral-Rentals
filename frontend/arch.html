<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Your Arch | Haven Floral Rentals</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="arch.css">
</head>
<body>
    <header>
        <div class="logo"><img src="images/logo.png" alt="Haven Floral Rentals"></div>
        <nav>
            <a href="index.html">Home</a>
            <a href="gallery.html">Gallery</a>
            <a href="event.html" class="active">Event</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="arch-designer">
        <section class="arch-heading">
            <p>CREATE SOMETHING YOUR OWN</p>
            <h1>Design Your Arch</h1>
            <p class="arch-instructions">Choose a floral design and customize your arch for your event.</p>
        </section>

        <div class="designer-container">
            <section class="arch-preview">
                <h2>Your Arch Preview</h2>
                <div class="arch-preview-area">
                    <div class="arch-layers">
                        <img id="drape-preview-image" class="drape-layer" src="" alt="Arch draping">
                        <img id="light-preview-image" class="light-layer" src="" alt="Hanging lights">
                        <img id="arch-preview-image" class="arch-layer" src="images/arch1.png" alt="Selected floral arch">
                    </div>
                </div>
            </section>

            <section class="arch-controls">
                <h2>Customize</h2>

                <div class="design-option">
                    <h3>Floral Design</h3>
                    <p id="selected-design">Selected: Golden Garden</p>
                    <div class="floral-options">
                        <button class="floral-option selected" type="button" data-design="orange" data-image="images/arch1.png">
                            <img src="images/orange-flower-icon.png" alt="Orange floral design">
                            <span>Golden Garden</span>
                        </button>
                        <button class="floral-option" type="button" data-design="purple" data-image="images/arch2.png">
                            <img src="images/purple-flower-icon.png" alt="Purple floral design">
                            <span>Purple Garden</span>
                        </button>
                    </div>
                </div>

                <div class="design-option">
                    <h3>Draping</h3>
                    <div class="option-buttons">
                        <button class="drape-option selected" type="button" data-image="">None</button>
                        <button class="drape-option" type="button" data-image="images/purple-drapes.png">Drapes</button>
                    </div>
                </div>

                <div class="design-option">
                    <h3>Lighting</h3>
                    <div class="option-buttons">
                        <button class="light-option selected" type="button" data-image="">None</button>
                        <button class="light-option" type="button" data-image="images/lightfixtures.png">Hanging Lights</button>
                    </div>
                </div>

                <a href="review.html" class="button primary-button arch-continue">Review Your Design</a>
            </section>
        </div>
    </main>

    <script src="arch.js"></script>
</body>
</html>
