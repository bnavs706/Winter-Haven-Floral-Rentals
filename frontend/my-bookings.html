
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Bookings | Haven Floral Rentals</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="my-bookings.css">
</head>

<body>

    <!-- SAME HEADER AS HOMEPAGE -->
    <header>
        <div class="logo">
            <img src="images/logo.png"
                 alt="Haven Floral Rentals">
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="gallery.html">Gallery</a>
            <a href="event.html">Event</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a class="active" href="my-bookings.html">
                My Bookings
            </a>
        </nav>
    </header>

    <!-- MY BOOKINGS PAGE -->
    <main class="bookings-page">

        <section class="bookings-card">

            <div class="bookings-icon">
                &#9993;
            </div>

            <h1>My Bookings</h1>

            <p class="bookings-intro">
                Enter the email address used for your
                booking to securely access your
                event information.
            </p>

            <!-- EMAIL ENTRY -->
            <form id="email-form">

                <label for="booking-email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="booking-email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

                <button type="submit"
                        class="bookings-button">
                    Send Verification Code
                </button>

            </form>

            <!-- VERIFICATION FORM -->
            <form id="verification-form" hidden>

                <h2>Verify Your Email</h2>

                <p>
                    Enter the six-digit code sent
                    to your email address.
                </p>

                <label for="verification-code">
                    Verification Code
                </label>

                <input
                    type="text"
                    id="verification-code"
                    placeholder="000000"
                    inputmode="numeric"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    autocomplete="one-time-code"
                    required
                >

                <button type="submit"
                        class="bookings-button">
                    Verify &amp; View Bookings
                </button>

            </form>

            <!-- STATUS MESSAGES -->
            <p id="verification-message"
               role="status"
               aria-live="polite"></p>

            <!-- BOOKING HISTORY -->
            <section id="booking-history" hidden>

                <h2>Your Bookings</h2>

                <div id="booking-list"></div>

            </section>

        </section>

    </main>

    <script src="my-bookings.js"></script>

</body>
</html>
