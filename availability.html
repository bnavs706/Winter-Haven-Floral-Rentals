<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Availability | Haven Floral Rentals</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="availability.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/skeleton.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/classic/theme.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/classic/palette.css">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/all/global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/classic/global.js"></script>
</head>
<body>
    <header>
        <div class="logo"><img src="images/logo.png" alt="Haven Floral Rentals"></div>
        <nav>
            <a href="index.html">Home</a>
            <a href="gallery.html">Gallery</a>
            <a href="event.html" class="active">Event</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="availability-page">
        <section class="availability-intro">
            <p class="section-label">START YOUR DESIGN</p>
            <h1>Choose Your Event Date</h1>
            <p>Select an available date to begin designing your floral arrangement.</p>
        </section>

        <section class="calendar-section">
            <div id="calendar"></div>

            <div class="availability-legend">
                <div class="legend-item"><span class="legend-dot available-dot"></span>Available</div>
                <div class="legend-item"><span class="legend-dot unavailable-dot"></span>Unavailable</div>
                <div class="legend-item"><span class="legend-dot selected-dot"></span>Selected</div>
            </div>

            <div class="date-selection">
                <p id="selected-date-text">Please select an available date.</p>
                <a id="continue-design" href="arch.html" class="button primary-button disabled">Continue to Design</a>
            </div>
        </section>
    </main>

    <script src="availability.js"></script>
</body>
</html>
