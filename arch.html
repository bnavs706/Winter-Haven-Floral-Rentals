<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Design Your Arch</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="logo">
            <img src="images/logo.png" alt="Haven Floral Rentals">
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="gallery.html">Gallery</a>
            <a href="event.html">Event</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>


    <main class="arch-builder">

        <div class="arch-heading">

            <p>CREATE SOMETHING YOUR OWN</p>

            <h1>Design Your Arch</h1>

            <p class="arch-instructions">
                Select an area of the arch to begin adding flowers.
            </p>

        </div>


        <div class="builder-container">

           <!-- Arch preview -->
<section class="arch-preview">

    <h2>Arch Preview</h2>

    <div class="arch-canvas">

        <img
            src="images/arch.png"
            alt="Floral arch preview"
            class="arch-image"
        >

        <div class="arch-zone top" data-section="Top"></div>

        <div
            class="arch-zone upper-left"
            data-section="Upper Left">
        </div>

        <div
            class="arch-zone upper-right"
            data-section="Upper Right">
        </div>

        <div
            class="arch-zone middle-left"
            data-section="Middle Left">
        </div>

        <div
            class="arch-zone middle-right"
            data-section="Middle Right">
        </div>

        <div
            class="arch-zone lower-left"
            data-section="Lower Left">
        </div>

        <div
            class="arch-zone lower-right"
            data-section="Lower Right">
        </div>

    </div>

</section>

            <!-- Controls -->
            <section class="arch-controls">

                <h2>Customize</h2>

                <p>
                    Selected Section:
                    <span id="selected-section">None</span>
                </p>

                <h3>Flowers</h3>

                <button id="add-flowers">
                    Add Flowers
                </button>

                <button id="remove-flowers">
                    Remove Flowers
                </button>


                <h3>Flower Color</h3>

                <button class="color-button" data-color="white">
                    White
                </button>

                <button class="color-button" data-color="pink">
                    Pink
                </button>

                <button class="color-button" data-color="red">
                    Red
                </button>


                <br><br>

                <button id="reset-design">
                    Reset Design
                </button>

            </section>

        </div>

    </main>


    <script src="arch.js"></script>

</body>

</html>
